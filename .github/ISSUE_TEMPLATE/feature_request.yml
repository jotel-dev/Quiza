name: "Feature Request"
description: "Suggest an idea or architectural improvement for Quiza"
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate ideas for improving gameplay, developer experience, and protocol features!
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Where should this feature be introduced?
      options:
        - "Smart Contract & Token Economics"
        - "Backend API & Verifier Worker"
        - "Frontend UI & Game Experience"
        - "Wallet & Protocol Integrations"
        - "Developer Experience & Tooling"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? (e.g., "I'm always frustrated when...")
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      description: Would you be willing to submit a Pull Request for this feature?
      options:
        - label: "Yes, I am willing to implement this feature and submit a PR."
